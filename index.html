<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tienda</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/app.css">
</head>
<body>

<div id="toast-container"></div>

<!-- NAVBAR -->
<nav id="navbar" class="glass">
  <div class="max-w-7xl mx-auto flex items-center justify-between gap-4">
    <div class="flex items-center gap-2 flex-shrink-0">
      <span style="font-size:24px;" data-brand="emoji">🛍️</span>
      <span data-brand="name" style="font-size:18px; font-weight:900; background:linear-gradient(135deg,#FF6B8A,#FF9F5B); background-clip:text; -webkit-background-clip:text; -webkit-text-fill-color:transparent;">Tienda</span>
    </div>
    <div class="flex-1 max-w-md hidden sm:block">
      <div class="relative">
        <input id="search-input" type="text" placeholder="Buscar..."
          class="w-full pl-10 pr-4 py-2.5 rounded-2xl bg-gray-100 border-0 text-sm font-semibold"
          oninput="applyFilters()">
        <svg class="absolute left-3 top-3 w-4 h-4 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
        </svg>
      </div>
    </div>
    <div class="flex items-center gap-3">
      <span id="currency-chip" class="hidden sm:inline text-xs font-black text-gray-500 bg-gray-100 rounded-full px-3 py-1.5"></span>
      <a id="admin-link" href="admin.html" class="text-xs font-semibold text-gray-400 hover:text-gray-600 hidden sm:block">Admin</a>
      <button id="cart-btn" onclick="toggleCart()" class="relative p-2 rounded-2xl bg-gray-100 hover:bg-gray-200 transition-colors" aria-label="Carrito">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 11H4L5 9z"/>
        </svg>
        <span id="cart-count" class="absolute -top-1 -right-1 w-5 h-5 bg-red-500 text-white text-xs font-black rounded-full items-center justify-center" style="display:none">0</span>
      </button>
    </div>
  </div>
</nav>

<main class="max-w-7xl mx-auto px-4 py-6">
  <!-- Hero -->
  <div class="hero-gradient rounded-3xl p-8 mb-8 relative overflow-hidden fade-in" style="min-height:200px;">
    <div id="hero-emoji" style="position:absolute;right:-20px;top:-20px;font-size:160px;opacity:0.2;transform:rotate(15deg);"></div>
    <div class="relative z-10">
      <p id="hero-kicker" class="text-white/80 font-bold text-sm uppercase tracking-widest mb-2"></p>
      <h1 id="hero-title" class="text-white font-black text-4xl mb-3" style="line-height:1.1;"></h1>
      <p id="hero-subtitle" class="text-white/90 font-semibold text-sm mb-5" style="max-width:520px;"></p>
      <button onclick="$('products-section').scrollIntoView({behavior:'smooth'})"
        class="bg-white text-gray-800 font-black px-6 py-3 rounded-2xl text-sm hover:shadow-lg transition-all">
        Ver catálogo →
      </button>
    </div>
  </div>

  <!-- Buscador en celular -->
  <div class="sm:hidden mb-4">
    <input id="search-input-mobile" type="text" placeholder="Buscar..." class="field" oninput="$('search-input').value=this.value; applyFilters()">
  </div>

  <!-- Categorías -->
  <div class="mb-6 fade-in">
    <div class="flex gap-3 overflow-x-auto pb-2" id="categories-bar"></div>
  </div>

  <!-- Productos -->
  <div id="products-section" class="mb-8">
    <div class="section-header">
      <h2 class="section-title">Catálogo</h2>
      <span class="section-link" id="products-count">Cargando...</span>
    </div>
    <div class="products-grid" id="products-grid">
      <div class="skeleton" style="height:300px;"></div>
      <div class="skeleton" style="height:300px;"></div>
      <div class="skeleton" style="height:300px;"></div>
      <div class="skeleton" style="height:300px;"></div>
    </div>
  </div>
</main>

<!-- WhatsApp flotante: consultas -->
<a id="wa-float" class="btn-wa" href="#" target="_blank" rel="noopener" aria-label="Consultar por WhatsApp">
  <svg width="30" height="30" viewBox="0 0 24 24" fill="#fff"><path d="M17.5 14.4c-.3-.1-1.8-.9-2-1-.3-.1-.5-.1-.7.1-.2.3-.8 1-.9 1.2-.2.2-.3.2-.6.1-.3-.1-1.3-.5-2.4-1.5-.9-.8-1.5-1.8-1.7-2.1-.2-.3 0-.5.1-.6l.4-.5c.2-.2.2-.3.3-.5.1-.2 0-.4 0-.5l-.9-2.2c-.2-.6-.5-.5-.7-.5h-.6c-.2 0-.5.1-.8.4-.3.3-1 1-1 2.5s1.1 2.9 1.2 3.1c.1.2 2.1 3.2 5.1 4.5.7.3 1.3.5 1.7.6.7.2 1.4.2 1.9.1.6-.1 1.8-.7 2-1.4.2-.7.2-1.3.2-1.4-.1-.1-.3-.2-.6-.3zM12 2a10 10 0 00-8.6 15.1L2 22l5-1.3A10 10 0 1012 2z"/></svg>
</a>

<!-- CART -->
<div id="cart-overlay" onclick="toggleCart()"></div>
<div id="cart-drawer">
  <div style="padding:20px 20px 0;" class="flex items-center justify-between">
    <h2 style="font-size:22px; font-weight:900;">🛒 Mi Carrito</h2>
    <button onclick="toggleCart()" class="text-gray-400 hover:text-gray-600 text-2xl" aria-label="Cerrar">✕</button>
  </div>
  <div style="padding:12px 20px;">
    <div id="cart-pricing-info" class="text-xs font-bold text-gray-500 bg-gray-100 rounded-2xl px-3 py-2"></div>
  </div>
  <div id="cart-items" style="flex:1; overflow-y:auto; padding:12px 20px; display:flex; flex-direction:column; gap:12px;"></div>
  <div style="padding:16px 20px; border-top:1px solid #f0f0f5;">
    <div class="flex justify-between items-center mb-1">
      <span style="font-size:14px; font-weight:700; color:var(--text-sec);">Subtotal</span>
      <span id="cart-subtotal" style="font-size:15px; font-weight:800;"></span>
    </div>
    <div id="cart-discount-row" class="flex justify-between items-center mb-1" style="display:none;">
      <span style="font-size:14px; font-weight:700; color:#d6335a;">Descuento mayorista</span>
      <span id="cart-discount" style="font-size:15px; font-weight:800; color:#d6335a;"></span>
    </div>
    <div class="flex justify-between items-center mb-4 mt-2">
      <span style="font-size:16px; font-weight:900;">Total</span>
      <span id="cart-total" style="font-size:22px; font-weight:900;"></span>
    </div>
    <button onclick="proceedToCheckout()" id="checkout-btn"
      class="w-full py-4 rounded-2xl font-black text-white text-lg transition-all hover:opacity-90 disabled:opacity-40"
      style="background:linear-gradient(135deg,#FF6B8A,#FF9F5B);">
      Finalizar pedido →
    </button>
    <button onclick="clearCart()" class="w-full mt-2 py-2 text-sm text-gray-400 font-bold hover:text-gray-600">Vaciar carrito</button>
  </div>
</div>

<!-- MODALES -->
<div id="product-modal" class="modal-overlay">
  <div class="modal-box">
    <button onclick="closeModal('product-modal')" class="text-gray-400 hover:text-gray-600 text-2xl mb-4 block" aria-label="Cerrar">✕</button>
    <div id="product-modal-content"></div>
  </div>
</div>
<div id="checkout-modal" class="modal-overlay">
  <div class="modal-box">
    <button onclick="closeModal('checkout-modal')" class="text-gray-400 hover:text-gray-600 text-2xl mb-4 block" aria-label="Cerrar">✕</button>
    <div id="checkout-content"></div>
  </div>
</div>

<script src="js/config.js"></script>
<script src="js/demo-data.js"></script>
<script src="js/core.js"></script>
<script src="js/data.js"></script>
<script src="js/store.js"></script>
</body>
</html>
